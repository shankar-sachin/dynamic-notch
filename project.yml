name: DynamicNotch

options:
  bundleIdPrefix: com.sachi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9F9VM3M99N
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DynamicNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources/DynamicNotch
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Dynamic Notch
        # The product is "Dynamic Notch"; the Swift module stays spaceless, so
        # `@testable import DynamicNotch` keeps resolving.
        PRODUCT_MODULE_NAME: DynamicNotch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sachi.DynamicNotch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/DynamicNotch/Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: AppKit.framework
      - sdk: ScriptingBridge.framework
      - sdk: CoreAudio.framework
      - sdk: IOKit.framework
      - sdk: IOBluetooth.framework
      - sdk: ServiceManagement.framework

  DynamicNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DynamicNotchTests
    dependencies:
      - target: DynamicNotch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The product name has a space, so the generated host path needs saying
        # out loud rather than being inferred from the target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dynamic Notch.app/Contents/MacOS/Dynamic Notch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DynamicNotch:
    build:
      targets:
        DynamicNotch: all
        DynamicNotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DynamicNotchTests
